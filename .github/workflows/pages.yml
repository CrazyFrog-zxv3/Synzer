name: Deploy SYNZER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate static entry points
        run: |
          test -f index.html
          test -f main.js
          test -f packages/dsp-engine/src/core/SynzerEngine.js
          test -f packages/dsp-engine/src/core/VoiceEngine.js
          test -f packages/dsp-engine/src/worklets/synzer-processor.js
          node --check main.js
          node --check packages/dsp-engine/src/core/SynzerEngine.js
          node --check packages/dsp-engine/src/core/VoiceEngine.js
          node --check packages/dsp-engine/src/worklets/synzer-processor.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
