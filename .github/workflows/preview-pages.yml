name: Deploy SYNZER preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to publish under /preview/
        required: true
        default: feature/synth-engine-hardening-v0.3.0
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site (preserve root)
        uses: actions/checkout@v4
      - name: Checkout requested SYNZER build into preview/
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'feature/synth-engine-hardening-v0.3.0' }}
          path: preview
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate preview entry points
        run: |
          test -f preview/index.html
          test -f preview/main.js
          test -f preview/packages/dsp-engine/src/core/SynzerEngine.js
          test -f preview/packages/dsp-engine/src/core/VoiceEngine.js
          test -f preview/packages/dsp-engine/src/worklets/synzer-processor.js
          node --check preview/main.js
          node --check preview/packages/dsp-engine/src/core/SynzerEngine.js
          node --check preview/packages/dsp-engine/src/core/VoiceEngine.js
          node --check preview/packages/dsp-engine/src/worklets/synzer-processor.js
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview alongside production
        id: deployment
        uses: actions/deploy-pages@v4
