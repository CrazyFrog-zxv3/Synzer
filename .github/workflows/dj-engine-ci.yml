name: SYNZER DJ Engine CI

on:
  push:
    branches:
      - "feature/dj-*"
  pull_request:
    paths:
      - "packages/dj-engine/**"
      - "package.json"
      - ".github/workflows/dj-engine-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic tests
        run: npm test
